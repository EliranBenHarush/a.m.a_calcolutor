<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מחשבון הוצאות - מעקב הוצאות שותפים</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>מחשבון הוצאות</h1>
    <p class="subtitle">מעקב הוצאות בין השותפים</p>

    <div id="status-banner" class="status-banner"></div>

    <div class="card">
      <h2>הוספת רשומה</h2>
      <form id="entry-form">
        <div class="form-row">
          <div>
            <label for="name-select">שם</label>
            <select id="name-select" required>
              <option value="" disabled selected>בחר שם</option>
            </select>
          </div>
          <div>
            <label for="amount-input">סכום</label>
            <input type="number" id="amount-input" placeholder="לדוגמה: 4000" min="0" step="0.01" required />
          </div>
        </div>
        <div>
          <label for="desc-input">תיאור</label>
          <input type="text" id="desc-input" placeholder="לדוגמה: ניתן עבור שער חשמלי" />
        </div>
        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn-primary">הוסף רשומה</button>
          <button type="button" id="cancel-edit-btn" class="btn-secondary" style="display:none;">ביטול עריכה</button>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="table-header">
        <h2>כל הרשומות</h2>
        <div class="filter-wrap">
          <label for="filter-select">סינון לפי שם</label>
          <select id="filter-select">
            <option value="">כולם</option>
          </select>
        </div>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>שם</th>
              <th>סכום</th>
              <th>תיאור</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="entries-body"></tbody>
        </table>
      </div>
      <div id="empty-state" class="empty-state">עדיין אין רשומות</div>
    </div>

    <div class="card">
      <h2>סיכום לפי שותף</h2>
      <div id="summary-list" class="summary-list"></div>
      <div class="summary-total">
        <span>סה"כ הוצאות</span>
        <span id="total-value">₪0</span>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
